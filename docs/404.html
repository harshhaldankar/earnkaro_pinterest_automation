<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Deal Expired — Get Your Deal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0F1216;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #181C22;
      border: 1px solid #282E38;
      border-radius: 24px;
      padding: 48px 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.6);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 85, 0, 0.12);
      color: #FF5500;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 9999px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 12px;
      color: #FFFFFF;
      letter-spacing: -0.5px;
    }
    p {
      color: #9CA3AF;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: #FF5500;
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 800;
      font-size: 16px;
      padding: 16px 28px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(255, 85, 0, 0.35);
      transition: background 0.2s, transform 0.15s;
    }
    .btn:hover {
      background: #E04B00;
      transform: scale(0.99);
    }
    .timer-text {
      font-size: 12px;
      color: #6B7280;
      margin-top: 16px;
    }
  </style>
  <script>
    var count = 2;
    var interval = setInterval(function() {
      count--;
      var el = document.getElementById("timer");
      if (el) el.innerText = count;
      if (count <= 0) {
        clearInterval(interval);
        window.location.replace("https://harshhaldankar.github.io/Getyourdeal/deals/");
      }
    }, 1000);
  </script>
</head>
<body>
  <div class="card">
    <div class="badge">? Flash Deal Expired</div>
    <h1>This Deal Has Ended!</h1>
    <p>Top loot drops and price glitches sell out in hours. We are redirecting you to today's verified live drops...</p>
    <a href="https://harshhaldankar.github.io/Getyourdeal/deals/" class="btn">
      Browse Live Deals &rarr;
    </a>
    <div class="timer-text">Redirecting in <span id="timer">2</span>s...</div>
  </div>
</body>
</html>
