name: Phase 1 - Website Update

on:
  schedule:
    - cron: '30 2 * * *'
    - cron: '30 13 * * *'
  workflow_dispatch:

jobs:
  run-website-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright "google-generativeai>=0.8.0" python-dotenv requests
          
      - name: Install Playwright browser
        run: python -m playwright install chromium --with-deps

      - name: Run Website Workflow
        env:
          EARNKARO_EMAIL:    ${{ secrets.EARNKARO_EMAIL }}
          EARNKARO_PASSWORD: ${{ secrets.EARNKARO_PASSWORD }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
        run: python workflow_1_website.py

      - name: Deploy to Public Website Repo
        env:
          WEBSITE_DEPLOY_TOKEN: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          WEBSITE_REPO:         ${{ secrets.WEBSITE_REPO }}
        run: |
          git clone https://x-access-token:${WEBSITE_DEPLOY_TOKEN}@github.com/${WEBSITE_REPO}.git _website_deploy
          
          # Copy everything from docs/ into the public repo
          cp -r docs/* _website_deploy/
          
          cd _website_deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "🤖 Auto-update website deals: $(date +'%d %b %Y, %H:%M UTC')"
          git push
