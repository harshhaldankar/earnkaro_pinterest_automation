name: "2 · Post pins"

# A short run every hour, 8:47 AM - 10:47 PM IST. One pin is due per hour from 8 AM (15 a day);
# each run posts what's due, catching up (up to 3) when GitHub started earlier runs late or not at
# all - it often does, so nothing here depends on any single run happening.
on:
  schedule:
    - cron: '17 3-17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post-pins
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium
          # GitHub's Ubuntu image already has the browser's system libraries; this only tops them up,
          # so an outage of Ubuntu's download servers (as on 11 Nov 2026) can't stop the run
          timeout 300 python -m playwright install-deps chromium || echo "::warning::Couldn't top up browser libraries; going on with what the runner has"

      - name: Pinterest login
        run: echo '${{ secrets.PINTEREST_SESSION_JSON }}' > pinterest_session.json

      - name: Finish uploaded outfit looks
        # Images made in Gemini from the weekly kit (inbox/combo-*): headline, website page, pin dates
        continue-on-error: true
        env:
          WEBSITE_DEPLOY_TOKEN: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
        run: python -m trends.weekly --ingest

      - name: Post what's due
        run: python -m trends.post

      - name: Save
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/posted.json pins_today.json data/pin_images data/looks.json docs/looks inbox 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Pinterest: posted $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull -q --rebase --autostash origin master && git push -q && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
