name: EarnKaro Top Deals (Pipeline 2)

on:
  schedule:
    # 08:30 and 18:30 IST. Not 15:00 UTC: Pipeline 1 runs then (0,5,10,15,20 UTC), and queuing
    # behind it pushed this run past Pinterest posting hours (7 AM-11 PM IST), so nothing got pinned.
    - cron: '0 3,13 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Shared with deals_automation.yml — see the note there (AuthKeyDuplicatedError)
concurrency:
  group: telegram-session
  cancel-in-progress: false

jobs:
  run-pipeline2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright google-genai python-dotenv requests telethon pillow aiohttp beautifulsoup4 lxml curl_cffi instagrapi

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: python -m playwright install chromium --with-deps

      - name: Write session cookies from secrets
        run: |
          echo '${{ secrets.PINTEREST_SESSION_JSON }}' > pinterest_session.json
          echo '${{ secrets.EARNKARO_SESSION_JSON }}'  > earnkaro_session.json
          echo '${{ secrets.INSTAGRAM_SESSION_JSON }}' > instagram_session.json
          echo '${{ secrets.INSTAGRAPI_SESSION_JSON }}' > instagrapi_session.json

      - name: Setup environment variables
        run: |
          cat << EOF > .env
          TELEGRAM_API_ID=${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH=${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION=${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHANNEL_ID=${{ secrets.TELEGRAM_CHANNEL_ID }}
          PINTEREST_EMAIL=${{ secrets.PINTEREST_EMAIL }}
          PINTEREST_PASSWORD=${{ secrets.PINTEREST_PASSWORD }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_P2=${{ secrets.GEMINI_API_KEY_P2 }}
          EARNKARO_EMAIL=${{ secrets.EARNKARO_EMAIL }}
          EARNKARO_PASSWORD=${{ secrets.EARNKARO_PASSWORD }}
          WEBSITE_DEPLOY_TOKEN=${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          AMAZON_AFFILIATE_TAG=${{ secrets.AMAZON_AFFILIATE_TAG }}
          INSTAGRAM_USERNAME=${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD=${{ secrets.INSTAGRAM_PASSWORD }}
          EOF

      - name: Create required directories
        run: |
          mkdir -p cache
          mkdir -p docs/deals/images
          mkdir -p pipeline2

      - name: Run Pipeline 2 Orchestrator
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python pipeline2/run_pipeline.py

      - name: Commit and Push Database Updates
        if: always()
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          git add -A --ignore-errors 2>/dev/null || true
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          
          git commit -m "Auto-update Pipeline 2 deals $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "Nothing to commit"
          git push
