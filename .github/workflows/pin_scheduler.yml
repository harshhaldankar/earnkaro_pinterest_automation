name: Pinterest Pin Scheduler

on:
  schedule:
    # GitHub runs hourly schedules only a couple of times a day (and late), so instead each run
    # stays up ~5.5 hours and pins one queued deal an hour itself. Starts 08:00, 14:00, 20:00 IST;
    # pin_scheduler.py stops at 23:00 IST and at the daily limit.
    - cron: '30 2,8,14 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Own group: the telegram-session group keeps only one pending run, so sharing it could
# cancel a queued pipeline run
concurrency:
  group: pinterest-pins
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright google-genai python-dotenv requests telethon pillow aiohttp beautifulsoup4 lxml curl_cffi numpy

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: python -m playwright install chromium --with-deps

      - name: Write Pinterest session
        run: echo '${{ secrets.PINTEREST_SESSION_JSON }}' > pinterest_session.json

      - name: Setup environment variables
        run: |
          cat << EOF > .env
          PINTEREST_EMAIL=${{ secrets.PINTEREST_EMAIL }}
          PINTEREST_PASSWORD=${{ secrets.PINTEREST_PASSWORD }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          EOF

      - name: Pin one queued deal an hour
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          save_records() {
            git add pinned_names.json pins_today.json 2>/dev/null || true
            git diff --cached --quiet && return 0
            git commit -q -m "Pinterest: scheduled pin $(date -u '+%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3; do
              git pull -q --rebase --autostash origin master && git push -q && return 0
              git rebase --abort 2>/dev/null || true
              sleep 10
            done
          }
          end=$((SECONDS + 330 * 60))
          while [ $SECONDS -lt $end ]; do
            # New deals from the pipelines arrive between pins
            git pull -q --rebase --autostash origin master || git rebase --abort 2>/dev/null || true
            python pin_scheduler.py || true
            save_records
            [ $((SECONDS + 3600)) -lt $end ] || break
            sleep 3600
          done
