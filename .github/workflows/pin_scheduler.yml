name: Pinterest Pin Scheduler

on:
  schedule:
    # One pin an hour, 08:00 to 22:00 IST (02:30-16:30 UTC): 15 a day, the daily pin limit.
    # The pipelines only queue deals; this spreads them through the day.
    - cron: '30 2-16 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Own group: the telegram-session group keeps only one pending run, so sharing it could
# cancel a queued pipeline run
concurrency:
  group: pinterest-pins
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright google-genai python-dotenv requests telethon pillow aiohttp beautifulsoup4 lxml curl_cffi numpy

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: python -m playwright install chromium --with-deps

      - name: Write Pinterest session
        run: echo '${{ secrets.PINTEREST_SESSION_JSON }}' > pinterest_session.json

      - name: Setup environment variables
        run: |
          cat << EOF > .env
          PINTEREST_EMAIL=${{ secrets.PINTEREST_EMAIL }}
          PINTEREST_PASSWORD=${{ secrets.PINTEREST_PASSWORD }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          EOF

      - name: Pin the next queued deal
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python pin_scheduler.py

      - name: Save pin records
        if: always()
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add pinned_names.json pins_today.json 2>/dev/null || true
          git diff --cached --quiet && echo "Nothing pinned" && exit 0
          git commit -m "Pinterest: scheduled pin $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase --autostash origin master && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
