name: "6 · Email the kit guide"

# Run by hand from the Actions tab: emails the weekly-kit guide (and this week's list) to EMAIL_TO.
# Needs the secrets GMAIL_USER, GMAIL_APP_PASSWORD (a Gmail app password) and EMAIL_TO
# (comma-separated addresses; a secret because this repo is public).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -r requirements.txt
      - name: Send
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m trends.weekly --email-guide
