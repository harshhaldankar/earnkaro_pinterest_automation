name: "6 · Send the kit guide"

# Run by hand from the Actions tab: posts the weekly-kit guide (and this week's list) as a GitHub
# issue that tags the owner, so GitHub notifies by email and in its app. Also emails it to EMAIL_TO
# once the secrets GMAIL_USER, GMAIL_APP_PASSWORD and EMAIL_TO exist (optional).
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  guide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -r requirements.txt
      - name: Send
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m trends.weekly --guide
