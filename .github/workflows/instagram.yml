name: "3 · Instagram reel"

# Every evening at 7 PM IST: posts the oldest video waiting in inbox/ (made in Gemini from the
# weekly kit, https://harshhaldankar.github.io/Getyourdeal/kit/) to Instagram with its caption.
# Run it by hand to post now (FORCE posts even if one already went out today).
on:
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "Post even if a reel already went out today"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install requests python-dotenv

      - name: Post one reel
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          WEBSITE_DEPLOY_TOKEN: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          python -m trends.instagram
