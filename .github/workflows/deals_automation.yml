name: Consolidated Deals & Brand Automation

on:
  schedule:
    - cron: '0 */5 * * *' # Run every 5 hours
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: write

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright google-genai python-dotenv requests telethon pillow

      - name: Install Playwright Chromium
        run: python -m playwright install chromium --with-deps

      - name: Write session cookies from secrets
        run: |
          echo '${{ secrets.PINTEREST_SESSION_JSON }}' > pinterest_session.json
          echo '${{ secrets.EARNKARO_SESSION_JSON }}'  > earnkaro_session.json
          echo '${{ secrets.INSTAGRAM_SESSION_JSON }}' > instagram_session.json

      # ── Step 1: Run Brand Curation Update (Phase 1) ──
      - name: Run Brand Curation Update
        env:
          EARNKARO_EMAIL:    ${{ secrets.EARNKARO_EMAIL }}
          EARNKARO_PASSWORD: ${{ secrets.EARNKARO_PASSWORD }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
        run: python workflow_1_website.py

      # ── Step 2: Run Telegram Watcher & Pinterest deals (Phase 2) ──
      - name: Run Telegram Watcher & Pinterest Curation
        env:
          TELEGRAM_API_ID:      ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH:    ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION:     ${{ secrets.TELEGRAM_SESSION }}
          EARNKARO_EMAIL:       ${{ secrets.EARNKARO_EMAIL }}
          EARNKARO_PASSWORD:    ${{ secrets.EARNKARO_PASSWORD }}
          PINTEREST_EMAIL:      ${{ secrets.PINTEREST_EMAIL }}
          PINTEREST_PASSWORD:   ${{ secrets.PINTEREST_PASSWORD }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
        run: python telegram_watcher.py

      # ── Step 3: Deploy all docs/ outputs to Getyourdeal public website ──
      - name: Deploy to Getyourdeal website
        if: always()   # Deploy even if one step fails or finds no deals
        env:
          DEPLOY_TOKEN: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "[DEPLOY] WEBSITE_DEPLOY_TOKEN not set — skipping deploy"
            exit 0
          fi

          echo "[DEPLOY] Starting deployment to Getyourdeal..."

          # Clone the website repo with token
          git clone https://x-access-token:${DEPLOY_TOKEN}@github.com/harshhaldankar/Getyourdeal.git _site_deploy

          # Sync the deals/ folder
          rsync -av --delete docs/deals/ _site_deploy/deals/

          # Also sync top-level files (index.html, privacy, etc) if present in docs/
          for f in docs/*.html docs/*.css docs/*.json; do
            [ -f "$f" ] && cp "$f" _site_deploy/ && echo "Copied $f"
          done

          cd _site_deploy

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "[DEPLOY] No changes to deploy."
          else
            git commit -m "bot: Live deals & brands update $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push origin HEAD
            echo "[DEPLOY] Successfully deployed to harshhaldankar.github.io/Getyourdeal ✓"
          fi
