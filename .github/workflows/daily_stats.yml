name: "4 · Daily stats"

# Every morning at 9:30 AM IST: read EarnKaro (profit, orders, clicks), Pinterest Analytics and Instagram,
# and save them in data/earnings/ and data/analytics/ for the dashboard
# (https://harshhaldankar.github.io/Getyourdeal/dashboard/) and Monday's plan.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      instagram_only:
        description: "Only read Instagram (no EarnKaro login, no Pinterest)"
        type: boolean
        default: false

permissions:
  contents: write

# Shared with "1 · Weekly trends": both write data/analytics/<date>.json on Mondays, so they never overlap
concurrency:
  group: stats-and-build
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium
          # GitHub's Ubuntu image already has the browser's system libraries; this only tops them up,
          # so an outage of Ubuntu's download servers (as on 11 Nov 2026) can't stop the run
          timeout 300 python -m playwright install-deps chromium || echo "::warning::Couldn't top up browser libraries; going on with what the runner has"

      - name: Logins
        run: |
          echo '${{ secrets.PINTEREST_SESSION_JSON }}' > pinterest_session.json
          cat << EOF > .env
          EARNKARO_EMAIL=${{ secrets.EARNKARO_EMAIL }}
          EARNKARO_PASSWORD=${{ secrets.EARNKARO_PASSWORD }}
          EOF

      - name: EarnKaro
        if: ${{ !inputs.instagram_only }}
        id: earnkaro
        continue-on-error: true
        run: python -m trends.earnings

      - name: Pinterest Analytics
        if: ${{ !inputs.instagram_only }}
        id: pinterest
        continue-on-error: true
        run: python -m trends.analytics

      - name: Instagram
        id: instagram
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python -m trends.ig_stats

      - name: Learn from the results
        continue-on-error: true
        run: python -m trends.learn

      - name: Save
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data/earnings data/analytics
          git add data/earnings data/analytics
          [ -f data/learnings.json ] && git add data/learnings.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Daily stats $(date -u '+%Y-%m-%d')"
          for i in 1 2 3; do
            git pull -q --rebase --autostash origin master && git push -q && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "Couldn't push the stats after 3 tries"
          exit 1

      - name: Fail if a source couldn't be read
        if: steps.earnkaro.outcome == 'failure' || steps.pinterest.outcome == 'failure' || steps.instagram.outcome == 'failure'
        run: |
          echo "EarnKaro: ${{ steps.earnkaro.outcome }} · Pinterest: ${{ steps.pinterest.outcome }} · Instagram: ${{ steps.instagram.outcome }}"
          exit 1
