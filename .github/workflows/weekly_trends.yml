name: "1 Â· Weekly trends"

# Every Monday 7:00 AM IST: find what India is searching on Pinterest, build this week's idea
# pages, pins and reels, and put the website live. Run it by hand from the Actions tab any time.
on:
  schedule:
    - cron: '30 1 * * 1'    # 7:00 AM IST
    - cron: '50 3 * * 1'    # 9:20 AM IST backup: builds only if 7 AM didn't (GitHub skips scheduled runs)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test only: build everything but don't publish or queue anything"
        type: boolean
        default: false
      only_if_not_built:
        description: "Skip if this week's ideas are already built (what the outside timer sends)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write   # the Monday notification that the week's kit is ready

concurrency:
  group: stats-and-build   # shared with "4 Â· Daily stats" (both write data/analytics on Mondays)
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium
          # GitHub's Ubuntu image already has the browser's system libraries; this only tops them up,
          # so an outage of Ubuntu's download servers (as on 11 Nov 2026) can't stop the run
          timeout 300 python -m playwright install-deps chromium || echo "::warning::Couldn't top up browser libraries; going on with what the runner has"

      - name: Settings
        run: |
          cat << EOF > .env
          EARNKARO_EMAIL=${{ secrets.EARNKARO_EMAIL }}
          EARNKARO_PASSWORD=${{ secrets.EARNKARO_PASSWORD }}
          WEBSITE_DEPLOY_TOKEN=${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          AMAZON_AFFILIATE_TAG=${{ secrets.AMAZON_AFFILIATE_TAG }}
          EOF

      - name: Pinterest login (to read our analytics)
        run: echo '${{ secrets.PINTEREST_SESSION_JSON }}' > pinterest_session.json

      - name: Find trends and build ideas
        env:
          PUBLISH: ${{ inputs.dry_run && '0' || '1' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONLY_IF_NOT_BUILT: ${{ (github.event_name == 'schedule' || inputs.only_if_not_built) && '1' || '0' }}
        run: python -m trends.build
