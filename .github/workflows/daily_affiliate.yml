name: Daily EarnKaro Pinterest Affiliate Automation

on:
  schedule:
    # 8:00 AM IST  = 2:30 AM UTC
    # 7:00 PM IST  = 1:30 PM UTC
    - cron: '30 2  * * *'
    - cron: '30 13 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      # ── Checkout private automation repo ──────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python setup ──────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser (Chromium)
        run: python -m playwright install chromium --with-deps

      # ── Step 1: Scrape EarnKaro & rank offers ──────────────────────────
      - name: Step 1 – Scrape & Rank Offers
        env:
          EARNKARO_EMAIL:    ${{ secrets.EARNKARO_EMAIL }}
          EARNKARO_PASSWORD: ${{ secrets.EARNKARO_PASSWORD }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
        run: python step1_scrape_offers.py

      # ── Step 2: Generate Pinterest + WhatsApp Hinglish content ─────────
      - name: Step 2 – Generate Content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python step2_generate_content.py

      # ── Step 3: Make EarnKaro affiliate links ──────────────────────────
      - name: Step 3 – Generate Affiliate Links
        env:
          EARNKARO_EMAIL:    ${{ secrets.EARNKARO_EMAIL }}
          EARNKARO_PASSWORD: ${{ secrets.EARNKARO_PASSWORD }}
        run: python step3_make_links.py

      # ── Step 4: Fetch product images, create pins & post to Pinterest ──
      - name: Step 4 – Post to Pinterest
        env:
          PINTEREST_EMAIL:      ${{ secrets.PINTEREST_EMAIL }}
          PINTEREST_PASSWORD:   ${{ secrets.PINTEREST_PASSWORD }}
          PINTEREST_BOARD_NAME: ${{ secrets.PINTEREST_BOARD_NAME }}
        run: python poster_pinterest.py

      # ── Step 5: Send results to Telegram ──────────────────────────────
      - name: Step 5 – Notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python poster_telegram.py

      # ── Step 6: Generate website deals page ────────────────────────────
      - name: Step 6 – Generate Website Deals Page
        run: python generate_website.py

      # ── Step 7: Push updated website to the PUBLIC website repo ───────
      # The public repo is:  https://github.com/USERNAME/earnkaro-website
      # WEBSITE_DEPLOY_TOKEN = GitHub PAT with repo write access (stored as secret)
      # WEBSITE_REPO         = "username/earnkaro-website"       (stored as secret)
      - name: Step 7 – Deploy to Public Website Repo
        env:
          WEBSITE_DEPLOY_TOKEN: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          WEBSITE_REPO:         ${{ secrets.WEBSITE_REPO }}
        run: |
          # Clone the public website repo
          git clone \
            https://x-access-token:${WEBSITE_DEPLOY_TOKEN}@github.com/${WEBSITE_REPO}.git \
            _website_deploy

          # Copy generated files into cloned repo (root level, no /docs subfolder)
          cp docs/deals.html  _website_deploy/deals.html
          cp docs/deals.css   _website_deploy/deals.css
          cp docs/index.html  _website_deploy/index.html
          cp docs/privacy.html _website_deploy/privacy.html
          cp docs/terms.html  _website_deploy/terms.html
          cp docs/style.css   _website_deploy/style.css

          # Copy pin images
          mkdir -p _website_deploy/pins
          cp -r docs/pins/. _website_deploy/pins/ 2>/dev/null || true

          # Commit & push
          cd _website_deploy
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet \
            || git commit -m "🤖 Auto-update: $(date +'%d %b %Y, %H:%M UTC')"
          git push
